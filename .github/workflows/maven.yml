name: CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'liberica'
        cache: maven

    - name: Build with Maven
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # Dependabot-triggered workflows cannot see repository secrets, so the
      # SonarCloud step only runs when a token is present. Oracle and Db2 are
      # excluded from a plain `mvn verify` because their images are slow and
      # Db2 has no arm64 manifest; GitHub's runners are amd64, so both run
      # natively here and the empty override runs the full matrix.
      run: |
        if [ -n "$SONAR_TOKEN" ]; then
          mvn -Pci -B verify sonar:sonar -Dexcluded.test.groups=
        else
          mvn -Pci -B verify -Dexcluded.test.groups=
        fi

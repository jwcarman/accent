site_name: accent
site_description: Which database is this JDBC connection actually talking to?
site_url: https://jwcarman.github.io/accent/
repo_url: https://github.com/jwcarman/accent
repo_name: jwcarman/accent
edit_uri: edit/main/docs/

docs_dir: docs

# Process artifacts (specs, plans) live under docs/superpowers and stay out
# of the published site.
exclude_docs: |
  /superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Reference:
      - Observed Strings: observed-strings.md
      - Changelog: https://github.com/jwcarman/accent/blob/main/CHANGELOG.md
